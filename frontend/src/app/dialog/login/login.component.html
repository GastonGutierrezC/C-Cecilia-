<mat-dialog-content>
  <div class="login-form">
    <mat-form-field appearance="outline">
      <mat-label>Nombre de usuario</mat-label>
      <input matInput [formControl]="userForm.controls.username">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput [formControl]="userForm.controls.email">
    </mat-form-field>
    <button mat-flat-button (click)="login()">iniciar sesion</button>
  </div>
</mat-dialog-content>
