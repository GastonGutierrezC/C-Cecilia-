<div class="success-dialog-container" [style.width]="data.width">
  <div class="success-dialog-header">
    <mat-icon class="success-icon">{{ data.icon }}</mat-icon>
    <h2 class="success-title">{{ data.title }}</h2>
  </div>

  <div class="success-dialog-content">
    <p>{{ data.message }}</p>
  </div>

  <div class="success-dialog-actions">
    <button mat-raised-button
            color="primary"
            (click)="closeDialog()"
            class="success-button">
      {{ data.buttonText }}
    </button>
  </div>
</div>
